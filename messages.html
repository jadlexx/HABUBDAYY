<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <link rel="stylesheet" href="stylemessages.css" />
</head>

<body>
  <div id="canvas-container"></div>

  <section class="slider-container">
    <div class="slider-images">
      <div class="slider-img">
        <img src="p1.png" alt="2" />
        <h1>CLICK ME</h1>
        <div class="details">
          <h2>CLICK ME</h2>
        </div>
      </div>
      <div class="slider-img">
        <img src="p2.png" alt="3" />
        <h1>CLICK ME</h1>
        <div class="details">
          <h2>CLICK ME</h2>
        </div>
      </div>
      <div class="slider-img active">
        <img src="p5.png" alt="4" />
        <h1>CLICK ME</h1>
        <div class="details">
          <h2>CLICK ME</h2>
        </div>
      </div>
      <div class="slider-img">
        <img src="p3.png" alt="5" />
        <h1>CLICK ME</h1>
        <div class="details">
          <h2>CLICK ME</h2>
        </div>
      </div>
      <div class="slider-img">
        <img src="p4.png" alt="6" />
        <h1>CLICK ME</h1>
        <div class="details">
          <h2>CLICK ME</h2>
        </div>
      </div>
    </div>
    <div class="gallery-btn-group">
      <a href="gallery.html" class="btn">Back</a>
      <a href="finalmessages.html" class="btn">Next Slide</a>
    </div>
  </section>

  <script>
    jQuery(document).ready(function ($) {
      $(".slider-img").on("click", function () {
        $(".slider-img").removeClass("active");
        $(this).addClass("active");
      });

      $('a[href]').on('click', function (e) {
        const href = $(this).attr('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
          e.preventDefault();
          $('body').addClass('fade-out');
          setTimeout(() => { window.location.href = href; }, 600);
        }
      });
    });

    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const heartShape = new THREE.Shape();
    heartShape.moveTo(0.5, 0.5);
    heartShape.bezierCurveTo(0.5, 0.5, 1, 0, 0, 0);
    heartShape.bezierCurveTo(-1, 0, -1, 1.5, -1, 1.5);
    heartShape.bezierCurveTo(-1, 2.5, 0.5, 3.5, 0.5, 3.5);
    heartShape.bezierCurveTo(0.5, 3.5, 2, 2.5, 2, 1.5);
    heartShape.bezierCurveTo(2, 1.5, 2, 0, 1, 0);
    heartShape.bezierCurveTo(0.5, 0, 0.5, 0.5, 0.5, 0.5);

    const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelSegments: 3, bevelSize: 0.2, bevelThickness: 0.3 };
    const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);

    const hearts = [];
    const colors = [0xff6b6b, 0xff8e8e, 0xffb3b3, 0xffd8d8, 0xff9e9e, 0xffc1c1, 0xff6b8e, 0xff8eb3];

    for (let i = 0; i < 25; i++) {
      const material = new THREE.MeshPhongMaterial({
        color: colors[Math.floor(Math.random() * colors.length)],
        emissive: 0xff0000,
        emissiveIntensity: 0.1,
        shininess: 100,
        transparent: true,
        opacity: 0.9
      });

      const heart = new THREE.Mesh(heartGeometry, material);
      heart.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 50);
      const scale = Math.random() * 0.8 + 0.5;
      heart.scale.set(scale, scale, scale);
      heart.rotation.x = Math.random() * Math.PI;
      heart.rotation.y = Math.random() * Math.PI;

      heart.userData = {
        speedX: Math.random() * 0.02 - 0.01,
        speedY: Math.random() * 0.02 - 0.01,
        speedZ: Math.random() * 0.02 - 0.01,
        rotationSpeedX: Math.random() * 0.01,
        rotationSpeedY: Math.random() * 0.01,
        originalX: heart.position.x,
        originalY: heart.position.y,
        originalZ: heart.position.z,
        floatDistance: 2 + Math.random() * 3
      };

      scene.add(heart);
      hearts.push(heart);
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    function animate() {
      requestAnimationFrame(animate);
      const time = Date.now() * 0.001;
      hearts.forEach(heart => {
        heart.position.x = heart.userData.originalX + Math.sin(time * heart.userData.speedX * 10) * heart.userData.floatDistance;
        heart.position.y = heart.userData.originalY + Math.sin(time * heart.userData.speedY * 10) * heart.userData.floatDistance;
        heart.position.z = heart.userData.originalZ + Math.sin(time * heart.userData.speedZ * 10) * heart.userData.floatDistance;
        heart.rotation.x += heart.userData.rotationSpeedX;
        heart.rotation.y += heart.userData.rotationSpeedY;
      });
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
